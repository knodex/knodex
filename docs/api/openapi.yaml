          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOProviderRequest'
      responses:
        '200':
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOProviderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete SSO provider
      tags: [sso]
      operationId: deleteSSOProvider
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # License (Enterprise)
  # -------------------------------------------------------------------------
  /api/v1/license:
    get:
      summary: Get license status
      description: Returns current enterprise license status.
      tags: [license]
      operationId: getLicenseStatus
      security:
