  # -------------------------------------------------------------------------
  /api/v1/groups/observed:
    get:
      summary: List observed OIDC groups
      description: >-
        Returns the distinct OIDC group strings Knodex has passively observed in
        login tokens, each with its last-seen timestamp, ordered most-recently-seen
        first. Feeds a typeahead in the team/role editor so operators can pick real,
        observed groups instead of typing them blind. Requires operator access
        (`settings:get` permission). No IdP admin credentials are used; groups are
        learned passively from tokens already validated at login.
      tags: [groups]
      operationId: listObservedGroups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Observed groups (empty list when discovery is unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservedGroupsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  # -------------------------------------------------------------------------
  # Teams (Story 10.4)
  # -------------------------------------------------------------------------
  /api/v1/integration/teams:
    get:
      summary: List teams (replicator contract)
      description: >-
        Read-only source data for the future, separate-repo Grafana replicator.
        Returns every cluster-scoped Team with its **group identifier(s)**
        (`groupIdentifiers`, e.g. `kx-team-<org>-<slug>`) — the cross-tool join
        key (group identifier ↔ Grafana team). The response is derived purely
        from cluster CRDs and is **independent of the caller's token/claims**:
        identical output regardless of which groups the caller's token carries.


        **Roster source rule:** the group identifier is ALWAYS present and is the
        canonical join key (the replicator can resolve members from Keycloak
        itself). In **cloud-tenant** builds, `members` MAY be additionally
        enriched best-effort from the control-plane roster proxy; a roster fetch
        failure is non-fatal and the team is still returned with its group
        identifier. In **OSS / non-cloud** builds no roster is fetched and
        `members` is omitted.


        Operator-gated with the same `settings:get` check as `/api/v1/teams`
        (no new authorization resource).
      tags: [integration]
      operationId: listIntegrationTeams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team list (replicator contract)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationTeamListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/integration/projects:
    get:
      summary: List projects + team bindings (replicator contract)
      description: >-
        Read-only source data for the future, separate-repo Grafana replicator.
        Returns every Project with its `destinations` (namespaces) and its
        **team→project-role bindings** derived from `spec.roles[].teams[]`. Each
        binding resolves the bound teams to their group identifiers, so the
        replicator gets the join key directly. The replicator maps each project
        to a Grafana org (project ↔ Grafana org).


        Derived purely from cluster CRDs with **no token/claims dependency** —
        identical output regardless of the caller's token groups. A team named in
        a binding but with no matching Team CRD is returned with empty
        `groupIdentifiers` (non-fatal). Operator-gated (`settings:get`).
      tags: [integration]
      operationId: listIntegrationProjects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project list with team bindings (replicator contract)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/teams:
    get:
      summary: List teams
      description: >-
        Returns all cluster-scoped Teams. A Team names a reusable set of OIDC
        groups that a project role can bind via `roles[].teams[]`. Requires
        operator access (`settings:get` permission).
      tags: [teams]
      operationId: listTeams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a team
      description: >-
        Creates a new cluster-scoped Team. The name must be a DNS-1123 subdomain
        and the team must reference at least one non-empty OIDC group (≤253 chars,
        no duplicates). Requires operator access (`settings:update` permission).
      tags: [teams]
      operationId: createTeam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Team already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/teams/{name}:
    get:
      summary: Get team details
      description: Returns a single Team by name. Requires operator access (`settings:get`).
      tags: [teams]
      operationId: getTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamName'
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a team
      description: >-
        Updates a Team's description and OIDC groups (the name is immutable).
        Requires operator access (`settings:update`). A successful write triggers
        automatic re-resolution of any project roles bound to the team.
      tags: [teams]
      operationId: updateTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a team
      description: Deletes a Team by name. Requires operator access (`settings:update`).
      tags: [teams]
      operationId: deleteTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamName'
      responses:
        '204':
          description: Team deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # Users (Story 15.8) — operator surface over the canonical identity roster
  # -------------------------------------------------------------------------
  /api/v1/users:
    get:
      summary: List users
      description: >-
        Returns a keyset-paginated page of the canonical persistent users
        materialised on every OIDC login, ordered `last_seen_at DESC, id DESC`.
        Each user's `federatedIdentities` are expanded and a display-only
        `isInactive` flag is computed from `lastSeenAt` vs
        `IDENTITY_INACTIVE_THRESHOLD_DAYS` (default 30) — `isInactive` never
        participates in billing. Requires operator access (`settings:get`
        permission); no new authorization resource (single Casbin enforcement
        layer).
      tags: [users]
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, 1..200 (default 50). Out-of-range or non-integer → 400.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: pageToken
          in: query
          required: false
          description: Opaque keyset cursor from a prior page's `nextPageToken`. A malformed token → 400.
          schema:
            type: string
      responses:
        '200':
          description: User list (empty array when the org has no users)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{id}:
    get:
      summary: Get user details
      description: >-
        Returns a single user by ULID, with federated identities expanded and
        `isInactive` computed. A non-existent id, or an id belonging to another
        org (hidden by row-level security), returns `404` — never `403`, so user
        existence is not leaked across orgs. Requires operator access
        (`settings:get`).
      tags: [users]
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove a user (reclaim seat)
      description: >-
        Soft-deletes a user (`state='removed'`), immediately dropping them from
        the entitlement-based billed-seat count. The operation is idempotent.
        Removal reclaims the seat but does NOT permanently exclude the user:
        because users are resurrected on their next successful login, permanent
        exclusion requires IdP-side revocation — this is surfaced in the response
        `note`. A non-existent or cross-org id returns `404`. Requires operator
        access (`settings:update`).
      tags: [users]
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User removed / seat reclaimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

