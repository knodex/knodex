        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Concurrent modification

# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from local login or OIDC flow (HS256, 1hr expiry)

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    NamespaceQuery:
      name: namespace
      in: query
      description: Kubernetes namespace filter
      schema:
        type: string
    RGDName:
      name: name
      in: path
      required: true
      description: RGD resource name
      schema:
        type: string
    ProjectName:
      name: name
      in: path
      required: true
      description: Project name
      schema:
        type: string
    TeamName:
      name: name
      in: path
      required: true
      description: Team name (DNS-1123 subdomain)
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: User ULID (26-char Crockford base32)
      schema:
        type: string
    RoleName:
      name: role
      in: path
      required: true
      description: Role name (e.g., admin, developer, readonly)
      schema:
        type: string
    RepoId:
      name: repoId
      in: path
      required: true
      description: Repository configuration ID
      schema:
        type: string
    InstanceNamespace:
      name: namespace
      in: path
      required: true
      description: Instance namespace
      schema:
        type: string
    InstanceGroup:
      name: group
      in: path
      required: true
      description: Kubernetes API group of the resource type (e.g., apps.example.com)
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
        maxLength: 253
    InstanceKind:
      name: kind
      in: path
      required: true
      description: Instance kind (e.g., PostgresCluster)
      schema:
        type: string
    InstanceName:
      name: name
      in: path
      required: true
      description: Instance name
      schema:
        type: string

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: missing Authorization header
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: permission denied
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:
    # --- Common ---
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
            - VALIDATION_FAILED
            - RATE_LIMIT_EXCEEDED
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - DEPLOYMENT_MODE_NOT_ALLOWED
            - GITOPS_ERROR
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error context (field-level errors, etc.)

    # --- Health ---
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum: [healthy, degraded, unhealthy]
              message:
                type: string

    # --- Auth ---
    LocalLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            displayName:
              type: string
        token:
          type: string
          description: JWT Bearer token (HS256, 1hr expiry)

    OIDCProvider:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string

    # --- RGD Catalog ---
    RGDResponse:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        description:
          type: string
        version:
          type: string
        tags:
          type: array
          items:
            type: string
        category:
          type: string
        icon:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        instances:
          type: integer
        apiVersion:
          type: string
        kind:
          type: string
        allowedDeploymentModes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListRGDsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RGDResponse'
        totalCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CreateRGDRequest:
      type: object
      required: [yaml]
      properties:
        name:
          type: string
          description: Overrides the YAML's metadata.name (DNS-1123 subdomain)
        namespace:
          type: string
          description: Overrides the YAML's metadata.namespace (DNS-1123 label, defaults to "default")
        yaml:
          type: string
          description: The full ResourceGraphDefinition manifest (kro.run/v1alpha1 only)
        runId:
          type: string
          description: Originating RGD Builder run id — stamps the run's actionTaken field (best-effort)

    CreateRGDResponse:
      type: object
      properties:
        name:
          type: string
          example: webapp-stack
        namespace:
          type: string
          example: default
        kind:
          type: string
          example: ResourceGraphDefinition
        apiVersion:
          type: string
          example: kro.run/v1alpha1

    ResourceGraphResponse:
      type: object
      properties:
        rgdName:
          type: string
        rgdNamespace:
          type: string
        resources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              apiVersion:
                type: string
              kind:
                type: string
              isTemplate:
                type: boolean
              isConditional:
                type: boolean
              conditionExpr:
                type: string
              dependsOn:
                type: array
                items:
                  type: string
              externalRef:
                type: object
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  nameExpr:
                    type: string
                  namespaceExpr:
                    type: string
                  usesSchemaSpec:
                    type: boolean
                  schemaField:
                    type: string
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              type:
                type: string

    SchemaResponse:
      type: object
      properties:
        rgd:
          type: string
        crdFound:
          type: boolean
        schema:
          type: object
          description: JSON Schema for the CRD spec
        error:
          type: string

    # --- Instances ---
    ListInstancesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstanceDetail'
        totalCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    InstanceDetail:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        kind:
          type: string
        apiVersion:
          type: string
        rgdName:
          type: string
        status:
          type: string
        health:
          type: string
        deploymentMode:
          type: string
        conditions:
          type: array
          items:
            type: object
        spec:
          type: object
        createdAt:
          type: string
          format: date-time

    UpdateInstanceRequest:
      type: object
      properties:
        spec:
          type: object
          description: Updated spec values
        resourceVersion:
          type: string
          description: Resource version for optimistic concurrency control
        repositoryId:
          type: string
          description: Git repository config ID (required for gitops/hybrid mode updates)
        gitBranch:
          type: string
          description: Override the repository's default branch for this update
        gitPath:
          type: string
          description: Override the auto-generated semantic path for this update

    CreateInstanceRequest:
      type: object
      required: [name, namespace, rgdName]
      properties:
        name:
          type: string
          description: DNS-1123 compliant instance name
        namespace:
          type: string
        projectId:
          type: string
        rgdName:
          type: string
        rgdNamespace:
          type: string
        spec:
          type: object
          description: Instance spec values
        deploymentMode:
          type: string
          enum: [direct, gitops, hybrid]
          default: direct
        repositoryId:
          type: string
          description: Required for gitops/hybrid modes
        gitBranch:
          type: string
        gitPath:
          type: string

    CreateInstanceResponse:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        rgdName:
          type: string
        apiGroup:
          type: string
        kind:
          type: string
        version:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        deploymentMode:
          type: string
        gitInfo:
          type: object
          properties:
            commitSha:
              type: string
            path:
              type: string
            pushStatus:
              type: string

    PendingInstance:
      type: object
      properties:
        instanceId:
          type: string
        name:
          type: string
        namespace:
          type: string
        rgdName:
          type: string
        deploymentMode:
          type: string
        status:
          type: string
        pushedAt:
          type: string
          format: date-time
        commitSha:
          type: string
        isStuck:
          type: boolean

    # --- Projects ---
    ProjectListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        totalCount:
          type: integer

    ProjectResponse:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        destinations:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              server:
                type: string
        roles:
          type: array
          items:
            type: object
        resourceVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        destinations:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              server:
                type: string

    UpdateProjectRequest:
      type: object
      required: [resourceVersion]
      properties:
        description:
          type: string
        destinations:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              server:
                type: string
        roles:
          type: array
          items:
            type: object
        resourceVersion:
          type: string
          description: Required for optimistic concurrency

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    # --- Role Bindings ---
    RoleBindingResponse:
      type: object
      properties:
        project:
          type: string
        role:
          type: string
        subject:
          type: string
        type:
          type: string
          enum: [user, group]

    ListRoleBindingsResponse:
      type: object
      properties:
        project:
          type: string
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/RoleBindingResponse'

    # --- Account ---
    AccountInfoResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        displayName:
          type: string
        groups:
          type: array
          items:
            type: string
        casbinRoles:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            type: string
        roles:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        issuer:
          type: string
        tokenExpiresAt:
          type: string
          format: date-time
        tokenIssuedAt:
          type: string
          format: date-time

    # --- Namespaces ---
    NamespaceListResponse:
      type: object
      properties:
        namespaces:
          type: array
          items:
            type: string
        count:
          type: integer

    # --- Agents ---
    AgentsStatusResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ready, not_installed, degraded]
          description: >-
            ready = CRD present AND controller healthy; not_installed = a check
            answered definitively negative; degraded = a check errored without
            a definitive answer (retryable).
        crdPresent:
          type: boolean
          nullable: true
          description: Whether the agents.kagent.dev CRD exists. Null when the check was indeterminate or not performed.
        controllerHealthy:
          type: boolean
          nullable: true
          description: Whether the kagent controller /health returned 200. Null when the check was short-circuited or indeterminate.
        message:
          type: string
          description: Human-readable explanation of the status.

    AgentModel:
      type: object
      required: [provider, name]
      description: >-
        Resolved AI model identity for an agent (Story 50.4). Provider label
        and model name ONLY — never an API key, provider endpoint, or secret
        reference (NFR-A4/A7). Surfaced as a transparency feature (UX-DR3).
      properties:
        provider:
          type: string
          description: Model provider label, e.g. "OpenAI", "Anthropic".
        name:
          type: string
          description: Model name, e.g. "gpt-4.1-mini".

    InstalledAgent:
      type: object
      required: [name, namespace, description, createdAt]
      properties:
        name:
          type: string
          description: Agent CR name.
        namespace:
          type: string
          description: Namespace the Agent CR is deployed in.
        description:
          type: string
          description: Agent spec.description; empty string when absent.
        createdAt:
          type: string
          description: RFC3339 creation timestamp; empty string when unknown.
        model:
          allOf:
            - $ref: '#/components/schemas/AgentModel'
          description: >-
            Resolved AI model (Story 50.4). Omitted when the model cannot be
            resolved (no ModelConfig, CRD absent, RBAC denied) — the agent
            stays fully listable.
        modelConfig:
          type: string
          description: >-
            Bound spec.declarative.modelConfig name; omitted for non-declarative
            agents. The model editor pre-selects this exact config by name.

    AgentsResponse:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          description: >-
            The caller's Casbin-accessible agents, sorted by namespace then
            name. Always present (default []).
          items:
            $ref: '#/components/schemas/InstalledAgent'

    ModelConfigSummary:
      type: object
      required: [name, provider, model]
      description: >-
        A kagent ModelConfig an agent can be repointed at: name plus resolved
        {provider, model} label. No secret reference is ever included (NFR-A4).
      properties:
        name:
          type: string
          description: ModelConfig CR name (the value written to the agent).
        provider:
          type: string
          description: Provider label, e.g. "openai", "azure".
        model:
          type: string
          description: Model identifier, e.g. "gpt-4o".

    ModelConfigsResponse:
      type: object
      required: [modelConfigs]
      properties:
        modelConfigs:
          type: array
          description: ModelConfigs in the namespace, sorted by name. Default [].
          items:
            $ref: '#/components/schemas/ModelConfigSummary'

    ModelSummary:
      type: object
      required: [name, namespace, provider, model]
      description: >-
        A kagent ModelConfig in the Models tab: identity plus resolved
        {provider, model}. The apiKeySecretRef and any secret value are NEVER
        included (NFR-A4).
      properties:
        name:
          type: string
          description: ModelConfig CR name.
        namespace:
          type: string
          description: Namespace the ModelConfig lives in.
        provider:
          type: string
          description: Provider label, e.g. "openai", "azure".
        model:
          type: string
          description: Model identifier, e.g. "gpt-4o".

    ModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          description: >-
            The caller's Casbin-accessible models, sorted by (namespace, name).
            Always present (default []).
          items:
            $ref: '#/components/schemas/ModelSummary'

    CreateModelRequest:
      type: object
      required: [name, provider, model, namespace, apiKey]
      description: >-
        Create a model: mints an API-key Secret (key `apiKey`) and a
        KnodexAgentModelConfig instance that KRO reconciles into a kagent ModelConfig.
      properties:
        name:
          type: string
          description: >-
            Model (and Secret) name. Must be a valid DNS-1123 subdomain.
        provider:
          type: string
          description: kagent provider name (openai, azure, gemini, anthropic).
        model:
          type: string
          description: Model identifier as understood by the provider, e.g. "gpt-4o".
        namespace:
          type: string
          description: >-
            Target namespace. Must be a valid DNS-1123 label and in the caller's
            Casbin-accessible set.
        apiKey:
          type: string
          format: password
          writeOnly: true
          description: >-
            Provider API key. Write-only — stored in the minted Secret and NEVER
            returned by any endpoint.

    EditAgentModelRequest:
      type: object
      required: [modelConfig]
      properties:
        modelConfig:
          type: string
          description: >-
            Name of the ModelConfig to repoint the agent at. Must be a valid
            DNS-1123 subdomain and already exist in the agent's namespace.

    AgentInvokeRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8192
          description: User message for the agent (control characters are stripped).
        contextRef:
          type: string
          maxLength: 512
          description: >-
            Optional context reference recorded on the run, e.g.
            "instance:{group}/{version}/{namespace}/{kind}/{name}" or
            "rgd:{name}".
        conversationId:
          type: string
          maxLength: 128
          description: >-
            Optional Knodex-side chat-session grouping key (Story 50.6). All
            turns of one mounted chat carry the same conversationId so they
            group into a single session. Distinct from kagentSessionId.

    AgentRun:
      type: object
      required: [id, actor, agentType, agentNamespace, contextRef, kagentSessionId, conversationId, inputSummary, recommendationSummary, actionTaken, timestamp, status, triggerType]
      properties:
        id:
          type: string
          description: Run record UUID.
        actor:
          type: string
          description: >-
            Authenticated Knodex user identity at invocation time (email,
            falling back to subject/user ID). Never sourced from kagent.
        agentType:
          type: string
          description: Agent identifier — the Agent CR name.
        agentNamespace:
          type: string
          description: >-
            Namespace of the Agent CR. Visible only when it matches the
            caller's Casbin-accessible namespace set (an empty namespace on a
            legacy run is not globally visible).
        contextRef:
          type: string
          description: Optional context reference supplied at invocation.
        kagentSessionId:
          type: string
          description: kagent session id (A2A response contextId). Empty while running.
        conversationId:
          type: string
          description: >-
            Knodex-side chat-session grouping key (Story 50.6). Empty for
            legacy runs persisted before 50.6 (each forms a singleton session).
        inputSummary:
          type: string
          description: Truncated user message (first 256 characters).
        recommendationSummary:
          type: string
          description: >-
            Truncated agent answer (first 1024 characters), or the error
            summary when the run failed. Empty while running.
        actionTaken:
          type: string
          description: Reserved for future stories; always empty in 49.4.
        timestamp:
          type: string
          format: date-time
          description: Invocation time.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Terminal-state time; absent while running.
        status:
          type: string
          enum: [running, completed, failed]
        triggerType:
          type: string
          description: How the run was triggered. Always "on_demand" in 49.4.

    AgentRunsResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          description: The requested page of visible runs, newest-first.
          items:
            $ref: '#/components/schemas/AgentRun'
        total:
          type: integer
          description: Total visible runs after the namespace-visibility filter.
        page:
          type: integer
        pageSize:
          type: integer

    SessionSummary:
      type: object
      required: [id, agentType, agentNamespace, firstPrompt, startedAt, lastActivityAt, runCount, status]
      properties:
        id:
          type: string
          description: >-
            Session id — the conversationId, or a run id for legacy singleton
            sessions (runs with no conversationId).
        agentType:
          type: string
          description: The conversation's agent identifier.
        agentNamespace:
          type: string
          description: The conversation's agent namespace.
        firstPrompt:
          type: string
          description: The oldest run's truncated input — identifies the conversation.
        startedAt:
          type: string
          format: date-time
          description: Oldest run's invocation time.
        lastActivityAt:
          type: string
          format: date-time
          description: Newest run's invocation time (the sort key, descending).
        runCount:
          type: integer
          description: Number of runs (turns) in the conversation.
        status:
          type: string
          enum: [running, completed, failed]
          description: The newest run's status.

    AgentSessionsResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          description: The requested page of visible sessions, most-recent-first.
          items:
            $ref: '#/components/schemas/SessionSummary'
        total:
          type: integer
          description: Total visible sessions after the namespace-visibility filter.
        page:
          type: integer
        pageSize:
          type: integer

    AgentSession:
      type: object
      required: [id, agentType, agentNamespace, runs]
      properties:
        id:
          type: string
          description: Session id (conversationId or legacy singleton run id).
        agentType:
          type: string
        agentNamespace:
          type: string
        runs:
          type: array
          description: The conversation's run records, ordered oldest→newest for replay.
          items:
            $ref: '#/components/schemas/AgentRun'

    AgentRunResult:
      type: object
      required: [runId, agentNamespace, status, response, error, completedAt]
      properties:
        runId:
          type: string
          description: Run record UUID this result belongs to.
        agentNamespace:
          type: string
          description: >-
            Namespace of the Agent CR; readable only when it matches the
            caller's Casbin-accessible namespace set.
        status:
          type: string
          enum: [completed, failed]
          description: Terminal run status — results only exist once terminal.
        response:
          type: string
          description: >-
            The FULL agent response text (completed runs). Empty on failure.
        error:
          type: string
          description: Failure description (failed runs). Empty on success.
        completedAt:
          type: string
          format: date-time
          description: Terminal-state time.
        policyValidation:
          $ref: '#/components/schemas/PolicyValidation'

    PolicyValidation:
      type: object
      description: >-
        Gatekeeper policy-validation outcome for a generated RGD spec (Story
        50.3, Enterprise). ABSENT on OSS builds and on Enterprise builds
        without a valid compliance license — the UI keys its
        Enterprise-license notice on that absence. Validation is server-side:
        one AdmissionReview per generated object is POSTed directly to
        Gatekeeper's validating webhook before the result is persisted.
      required: [status]
      properties:
        status:
          type: string
          enum: [passed, failed, unavailable]
          description: >-
            "passed" — every reviewed object allowed; "failed" — at least one
            constraint rejected/warned (see violations); "unavailable" —
            Gatekeeper not installed or unreachable (the spec is still
            returned; an unreachable Gatekeeper never fails the run).
        reason:
          type: string
          description: >-
            Stable explanation for an "unavailable" status (e.g. "Gatekeeper
            unreachable"). Never contains internal endpoints.
        violations:
          type: array
          description: Constraint violations when status is "failed".
          items:
            $ref: '#/components/schemas/PolicyViolation'
        revisedResponse:
          type: string
          description: >-
            Full agent text of the single automatic revision attempt (failed
            validations only; absent when the revision invoke failed).
        revisedStatus:
          type: string
          enum: [passed, failed, unavailable]
          description: Re-validation outcome of the revised spec.
        revisedViolations:
          type: array
          description: Violations of the revised spec when revisedStatus is "failed".
          items:
            $ref: '#/components/schemas/PolicyViolation'

    PolicyViolation:
      type: object
      description: One Gatekeeper constraint violation against a reviewed object.
      required: [constraint, message]
      properties:
        constraint:
          type: string
          description: Violated constraint's name (empty when the denial was unparseable).
        constraintKind:
          type: string
          description: Constraint kind, enriched from the constraint cache.
        enforcementAction:
          type: string
          description: The constraint's enforcement action ("deny", "warn", ...).
        message:
          type: string
          description: Human-readable violation message from the policy.
        resourceId:
          type: string
          description: >-
            The spec.resources[].id the reviewed object came from; empty when
            the violation is against the RGD object itself.

    # --- Settings ---
    SettingsResponse:
      type: object
      properties:
        organization:
          type: string

    # --- SSO ---
    SSOProviderResponse:
      type: object
      properties:
        name:
          type: string
        issuerURL:
          type: string
        clientID:
          type: string
        redirectURL:
          type: string
        scopes:
          type: array
          items:
            type: string

    SSOProviderRequest:
      type: object
      required: [name, issuerURL, clientID, clientSecret]
      properties:
        name:
          type: string
        issuerURL:
          type: string
        clientID:
          type: string
        clientSecret:
          type: string
          format: password
        redirectURL:
          type: string
        scopes:
          type: array
          items:
            type: string

    # --- Repositories ---
    RepositoryConfigInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        projectId:
          type: string
        repoURL:
          type: string
        authType:
          type: string
          enum: [https, ssh, github-app]
        defaultBranch:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateRepositoryRequest:
      type: object
      required: [name, projectId, repoURL, authType]
      properties:
        name:
          type: string
        projectId:
          type: string
        repoURL:
          type: string
        authType:
          type: string
          enum: [https, ssh, github-app]
        defaultBranch:
          type: string
          default: main
        enabled:
          type: boolean
          default: true
        sshAuth:
          type: object
          properties:
            privateKey:
              type: string
              format: password
        httpsAuth:
          type: object
          properties:
            username:
              type: string
            password:
              type: string
              format: password
            bearerToken:
              type: string
              format: password
        githubAppAuth:
          type: object
          properties:
            appId:
              type: string
            installationId:
              type: string
            privateKey:
              type: string
              format: password

    UpdateRepositoryRequest:
      type: object
      properties:
        name:
          type: string
        repoURL:
          type: string
        authType:
          type: string
        defaultBranch:
          type: string
        enabled:
          type: boolean

    TestConnectionRequest:
      type: object
      required: [repoURL, authType]
      properties:
        repoURL:
          type: string
        authType:
          type: string

    TestConnectionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        defaultBranch:
          type: string

    # --- License ---
    LicenseStatus:
      type: object
      properties:
        licensed:
          type: boolean
        enterprise:
          type: boolean
        status:
          type: string
        message:
          type: string
        seats:
          # STORY-465: per-org seat-usage snapshot. Present on EE builds (even at
          # cold start — `lastUpdated` is "" then); omitted entirely on OSS so
          # consumers can use field presence as a feature probe.
          $ref: '#/components/schemas/SeatUsage'

    SeatUsage:
      type: object
      description: |
        Active-user seat usage for the current organization, compared against the
        license.MaxUsers claim (STORY-465 AC #8). Observability only — this story
        does NOT introduce hard enforcement on top of these signals.
      properties:
        used:
          type: integer
          format: int64
          description: Distinct users active in the trailing `windowDays`.
        allowed:
          type: integer
          description: Mirrors `license.maxUsers` (0 = unlimited).
        windowDays:
          type: integer
          description: Trailing-window length, currently hard-coded to 30.
        percent:
          type: number
          format: double
          description: used / allowed (0.0 when allowed = 0).
        threshold:
          type: string
          enum: [ok, warn, exceeded]
          description: |
            "ok" when allowed == 0 OR percent < 0.80; "warn" when 0.80 <=
            percent < 1.0; "exceeded" when percent >= 1.0.
        lastUpdated:
          type: string
          description: |
            RFC3339 timestamp of the latest reconciliation, or "" when the
            reconciler has never successfully run (cold start). The UI renders
            "Active users: calculating…" in that case.
        advisoryOnly:
          type: boolean
          description: |
            True in cloud-tenant deployments where the control plane is the
            authoritative seat enforcer; the UI substitutes softer copy.

    # --- Compliance ---
    ComplianceStatus:
      type: object
      properties:
        available:
          type: boolean
        enterprise:
          type: boolean
        message:
          type: string
        gatekeeper:
          type: object

    ComplianceSummary:
      type: object
      properties:
        totalTemplates:
          type: integer
        totalConstraints:
          type: integer
        totalViolations:
          type: integer
        byEnforcement:
          type: object
          additionalProperties:
            type: integer

    ConstraintTemplate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        kind:
          type: string
        parameters:
          type: object
        constraintCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    Constraint:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        templateName:
          type: string
        enforcementAction:
          type: string
          enum: [deny, dryrun, warn]
        violationCount:
          type: integer
        match:
          type: object
        parameters:
          type: object
        createdAt:
          type: string
          format: date-time

    CreateConstraintRequest:
      type: object
      required: [name, templateName]
      properties:
        name:
          type: string
        templateName:
          type: string
        enforcementAction:
          type: string
          enum: [deny, dryrun, warn]
          default: dryrun
        parameters:
          type: object
        match:
          type: object
          properties:
            namespaces:
              type: array
              items:
                type: string
            scope:
              type: string
            kinds:
              type: array
              items:
                type: object
                properties:
                  apiGroups:
                    type: array
                    items:
                      type: string
                  kinds:
                    type: array
                    items:
                      type: string
        labels:
          type: object
          additionalProperties:
            type: string

    Violation:
      type: object
      properties:
        constraintKind:
          type: string
        constraintName:
          type: string
        enforcementAction:
          type: string
        message:
          type: string
        resourceKind:
          type: string
        resourceNamespace:
          type: string
        resourceName:
          type: string
        resourceApiVersion:
          type: string

    # --- Audit ---
    AuditEventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    AuditEvent:
      type: object
      properties:
        id:
          type: string
          description: ULID identifier
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
        userEmail:
          type: string
        sourceIP:
          type: string
        action:
          type: string
        resource:
          type: string
        name:
          type: string
        project:
          type: string
        namespace:
          type: string
        requestId:
          type: string
        result:
          type: string
          enum: [success, denied, error]
        details:
          type: object

    AuditStats:
      type: object
      properties:
        totalEvents:
          type: integer
        eventsToday:
          type: integer
        topUsers:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              count:
                type: integer
        deniedAttempts:
          type: integer
        byActionToday:
          type: object
          additionalProperties:
            type: integer
        byResultToday:
          type: object
          additionalProperties:
            type: integer

    AuditConfig:
      type: object
      properties:
        enabled:
          type: boolean
        retentionDays:
          type: integer
        maxStreamLength:
          type: integer
        excludeActions:
          type: array
          items:
            type: string
        excludeResources:
          type: array
          items:
            type: string

    # --- Views ---
    CustomView:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        filter:
          type: object

    # --- Kubernetes Resources ---
    K8sResourceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        count:
          type: integer

    APIResourcesResponse:
      type: object
      properties:
        resources:
          type: array
          items:
            type: object
            properties:
              apiGroup:
                type: string
              kind:
                type: string
        count:
          type: integer

    # --- RBAC Metrics ---
    RBACMetricsResponse:
      type: object
      properties:
        cache:
          type: object
        policy:
          type: object
        cacheManager:
          type: object

    ObservedGroup:
      type: object
      properties:
        name:
          type: string
          description: The observed OIDC group identifier.
        lastSeen:
          type: string
          format: date-time
          description: When this group string was most recently seen in a login token.

    ObservedGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ObservedGroup'

    IntegrationMember:
      type: object
      description: >-
        A team roster entry. Populated only in cloud-tenant builds (best-effort
        control-plane enrichment); omitted in OSS/non-cloud builds.
      properties:
        userId:
          type: string
          description: The member's user id.
        email:
          type: string
          description: The member's email address.
        name:
          type: string
          description: The member's display name.

    IntegrationTeam:
      type: object
      required: [name, groupIdentifiers]
      description: Replicator-facing view of a Team (decoupled from the UI TeamResponse).
      properties:
        name:
          type: string
          description: Cluster-scoped Team name.
        description:
          type: string
          description: Human-readable description of the team.
        groupIdentifiers:
          type: array
          description: >-
            The team's Keycloak group identifier(s) (`spec.oidcGroups`, e.g.
            `kx-team-<org>-<slug>`). This is the cross-tool join key
            (group identifier ↔ Grafana team). Always present (never null).
          items:
            type: string
        members:
          type: array
          description: >-
            Best-effort roster (cloud-tenant builds only). Omitted in OSS /
            non-cloud builds and when the control-plane roster fetch fails.
          items:
            $ref: '#/components/schemas/IntegrationMember'

    IntegrationTeamListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationTeam'
        totalCount:
          type: integer

    IntegrationTeamBinding:
      type: object
      required: [role, teams, groupIdentifiers]
      description: >-
        A project role and the teams bound to it (from `spec.roles[].teams[]`),
        with each bound team's group identifiers resolved for the replicator.
      properties:
        role:
          type: string
          description: The project role name.
        teams:
          type: array
          description: The Team names bound to this role.
          items:
            type: string
        groupIdentifiers:
          type: array
          description: >-
            The group identifiers the bound teams resolve to (the join key). A
            team with no matching Team CRD contributes nothing (empty, not null).
          items:
            type: string

    IntegrationProject:
      type: object
      required: [name, destinations, teamBindings]
      description: >-
        Replicator-facing view of a Project. The replicator maps each project to
        a Grafana org (project ↔ Grafana org).
      properties:
        name:
          type: string
          description: Project name.
        type:
          type: string
          description: Project tier (`app` or `platform`).
        description:
          type: string
          description: Human-readable description of the project.
        destinations:
          type: array
          description: The project's allowed deployment namespaces.
          items:
            type: string
        teamBindings:
          type: array
          description: Team→role bindings derived from `spec.roles[].teams[]`.
          items:
            $ref: '#/components/schemas/IntegrationTeamBinding'

    IntegrationProjectListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationProject'
        totalCount:
          type: integer

    TeamResponse:
      type: object
      required: [name, oidcGroups]
      properties:
        name:
          type: string
          description: Cluster-scoped Team name (DNS-1123 subdomain).
        description:
          type: string
          description: Human-readable description of the team.
        oidcGroups:
          type: array
          description: The OIDC groups this team represents.
          items:
            type: string

    TeamListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamResponse'
        totalCount:
          type: integer

    CreateTeamRequest:
      type: object
      required: [name, oidcGroups]
      properties:
        name:
          type: string
          description: Team name (DNS-1123 subdomain, immutable after creation).
        description:
          type: string
        oidcGroups:
          type: array
          description: At least one non-empty OIDC group (≤253 chars each, no duplicates).
          minItems: 1
          items:
            type: string

    UpdateTeamRequest:
      type: object
      required: [oidcGroups]
      properties:
        description:
          type: string
        oidcGroups:
          type: array
          description: At least one non-empty OIDC group (≤253 chars each, no duplicates).
          minItems: 1
          items:
            type: string

    FederatedIdentityResponse:
      type: object
      description: >-
        One federated identity behind a user. IdP-side opaque ids (externalId,
        sourceConnectorId) are deliberately omitted from the public API surface.
      required: [issuer, sub, providerKind, sourceKind, createdAt, updatedAt]
      properties:
        issuer:
          type: string
          description: OIDC issuer URL.
        sub:
          type: string
          description: OIDC subject (empty for SCIM-pushed rows not yet logged in).
        providerKind:
          type: string
          description: Provider kind (e.g. "oidc").
        sourceKind:
          type: string
          enum: [oidc_jit, keycloak_projection, scim_push]
          description: How this identity row was materialised.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      required: [id, email, displayName, state, isInactive, firstSeenAt, lastSeenAt, federatedIdentities]
      properties:
        id:
          type: string
          description: User ULID (26-char Crockford base32).
        email:
          type: string
        displayName:
          type: string
        state:
          type: string
          enum: [active, removed]
          description: Soft-delete state; resurrected on next login.
        isInactive:
          type: boolean
          description: >-
            Display-only — lastSeenAt older than IDENTITY_INACTIVE_THRESHOLD_DAYS.
            Orthogonal to state and never used for billing.
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        federatedIdentities:
          type: array
          description: Expanded federated identities (empty array, never null).
          items:
            $ref: '#/components/schemas/FederatedIdentityResponse'

    UsersListResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          description: Page of users (empty array, never null).
          items:
            $ref: '#/components/schemas/UserResponse'
        nextPageToken:
          type: string
          description: Opaque keyset cursor for the next page; omitted on the last page.

    DeleteUserResponse:
      type: object
      required: [id, state, note]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [removed]
        note:
          type: string
          description: Reclaim-semantics note (permanent exclusion requires IdP-side revocation).

security:
  - bearerAuth: []
