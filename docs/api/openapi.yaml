  /api/v1/settings/sso/providers/{name}:
    get:
      summary: Get SSO provider
      tags: [sso]
      operationId: getSSOProvider
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider details
          content:
            application/json:
