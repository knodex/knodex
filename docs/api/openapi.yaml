        - name: exclude_system
          in: query
          description: Exclude system namespaces (kube-system, etc.)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Namespace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceListResponse'

  /api/v1/projects/{name}/namespaces:
    get:
      summary: List project namespaces
      description: |
        Returns namespaces allowed by a project's destination policies.
        Rate limited to 20 req/min to prevent namespace enumeration.
      tags: [namespaces]
      operationId: listProjectNamespaces
      security:
        - bearerAuth: []
      x-ratelimit-requests-per-minute: 20
      parameters:
        - $ref: '#/components/parameters/ProjectName'
      responses:
        '200':
          description: Project namespaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # Agents
  # -------------------------------------------------------------------------
  /api/v1/agents/status:
    get:
      summary: Get kagent presence status
      description: >-
        Returns the kagent installation status for the AI Agents workspace. Presence
        requires both the agents.kagent.dev CRD and a healthy kagent
        controller. Any authenticated user can read. Always responds 200 —
        a degraded check is a structured payload, never a 5xx.
      tags: [agents]
      operationId: getAgentsStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: kagent presence status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsStatusResponse'

  /api/v1/agents:
    get:
      summary: List agents
      description: >-
        Returns the kagent Agent custom resources (agents.kagent.dev) in the
        caller's Casbin-accessible namespaces as a single list, filtered
        server-side via the Casbin-derived accessible-namespace set (the same
        single enforcement layer as GET /api/v1/instances). The `agents` array
        defaults to []. A caller with zero accessible namespaces receives an
        empty list (fail-closed) — there is no global agent surface.
      tags: [agents]
      operationId: listAgents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Agents visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/agents/templates:
    get:
      summary: List agent templates (RGDs discovered by Kind)
      description: >-
        Returns the agent-template ResourceGraphDefinitions, discovered by
        schema.kind == KnodexAgentTemplate rather than the catalog annotation
        (`knodex.io/catalog`). These RGDs are intentionally absent from the main
        catalog list, but the watcher still ingests them by Kind so each stays
        deployable via the standard Deploy flow (GET /api/v1/rgds/{name} →
        POST instance). Same envelope as GET /api/v1/rgds; project/org visibility
        applies.
      tags: [agents]
      operationId: listAgentTemplates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Agent-template RGDs visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRGDsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/agents/models:
    get:
      summary: List models (kagent ModelConfigs)
      description: >-
        Returns the kagent ModelConfig custom resources (modelconfigs.kagent.dev)
        in the caller's Casbin-accessible namespaces — the Models tab list. Each
        entry is name + namespace + resolved {provider, model} only; the
        apiKeySecretRef and any secret value are NEVER returned (NFR-A4). Filtered
        server-side via the same single Casbin accessible-namespace layer as GET
        /api/v1/agents. Zero accessible namespaces ⇒ empty list (fail-closed);
        CRD-absent ⇒ 200 empty. Sorted by (namespace, name).
      tags: [agents]
      operationId: listModels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Models visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a model (Secret + ModelConfig)
      description: >-
        Orchestrates, behind a single POST: validate → authorize (target
        namespace ∈ the caller's accessible set AND explicit Casbin secrets-create
        on secrets/{namespace}/{name}) → create the API-key Secret directly (key
        `apiKey`) → create the agents.knodex.io/v1alpha1 KnodexAgentModelConfig
        instance directly (KRO reconciles it into a kagent ModelConfig referencing the
        Secret) → on instance-create failure, best-effort delete the orphaned
        Secret. The apiKey is write-only and is NEVER echoed back (NFR-A4).
      tags: [agents]
      operationId: createModel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
      responses:
        '201':
          description: Model created (summary, never the apiKey)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A Secret or model with this name already exists in the namespace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/agents/{namespace}/{name}/modelconfigs:
    get:
      summary: List ModelConfigs available to an agent's namespace
      description: >-
        Returns the kagent ModelConfig custom resources (modelconfigs.kagent.dev)
        in {namespace} — the pool an agent can be repointed at via the model
        editor. Each entry is name + resolved {provider, model} only; secret
        references are never returned (NFR-A4). The {name} segment scopes
        authorization to a specific agent via the single Casbin
        accessible-namespace check. A denied namespace and a missing agent both
        return 404 (existence non-leak).
      tags: [agents]
      operationId: listAgentModelConfigs
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Namespace of the agent (and of the ModelConfig pool).
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Agent CR name (scopes authorization).
      responses:
        '200':
          description: ModelConfigs in the namespace, sorted by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfigsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agents/{namespace}/{name}/model:
    patch:
      summary: Change an agent's model
      description: >-
        Patches ONLY spec.declarative.modelConfig on the Agent CR — the system
        message, tools, and type are curated agent behaviour and are never
        modified here. The target ModelConfig must already exist in {namespace}
        (verified before patching; a missing one returns 404 so the UI surfaces a
        clear error instead of breaking the agent with a dangling reference).
        Authorization matches the modelconfigs list: the single Casbin
        accessible-namespace check.
      tags: [agents]
      operationId: editAgentModel
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Namespace of the agent.
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Agent CR name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAgentModelRequest'
      responses:
        '200':
          description: The agent's new resolved model identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agents/runs:
    get:
      summary: List agent run history
      description: >-
        Returns the history of agent invocations, newest-first. Visibility is
        the Casbin-derived accessible-namespace set applied server-side (the
        same single enforcement layer as GET /api/v1/agents): a run is visible
        only when its agent namespace matches the caller's set (fail-closed).
        Pagination is applied after the visibility filter, so page numbers are
        stable per-caller. Run records are written by Knodex at invocation
        time — there is no kagent CRD behind this endpoint. OSS storage is
        ephemeral (capped count + TTL in Redis).
      tags: [agents]
      operationId: listAgentRuns
      security:
        - bearerAuth: []
      parameters:
        - name: agentType
          in: query
          required: false
          schema:
            type: string
          description: Exact-match filter on the agent identifier.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [running, completed, failed]
          description: Exact-match filter on run status.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (max 100).
      responses:
        '200':
          description: Agent runs visible to the caller, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/agents/runs/{id}/result:
    get:
      summary: Get the full result of an agent run
      description: >-
        Returns the FULL terminal payload of an agent invocation (Story 50.1)
        — the complete agent response text, unlike the run record's
        recommendationSummary which is truncated to 1024 characters. Returns
        404 while no result exists: an in-flight run and an unknown run id
        are indistinguishable by design. Visibility mirrors the runs-list
        filter: a result is readable only when its agentNamespace matches the
        caller's Casbin-derived accessible-namespace set (fail-closed, 404
        non-leak). Results are ephemeral (24h TTL in Redis).
      tags: [agents]
      operationId: getAgentRunResult
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Run record UUID.
      responses:
        '200':
          description: The terminal result (completed or failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            No result available — the run is still in-flight, the id is
            unknown, or the caller lacks namespace access (non-leak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/agents/{namespace}/{name}/invoke:
    post:
      summary: Invoke an agent
      description: >-
        Invokes a deployed kagent agent via the server-side A2A bridge. The
        browser only ever talks to the Knodex server — the kagent endpoint,
        cluster credentials, and LLM keys never reach the frontend. A run
        record is written (status running) BEFORE kagent is called and the
        endpoint returns 202 with that record immediately; the A2A call
        completes in the background and updates the record to
        completed/failed (pushed over WebSocket as agent_run_update and
        readable via GET /api/v1/agents/runs). Authorization is the
        Casbin-derived accessible-namespace set: a denied namespace and a
        nonexistent agent both return the same 404 (existence non-leak).
      tags: [agents]
      operationId: invokeAgent
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Namespace of the kagent Agent CR.
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Name of the kagent Agent CR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInvokeRequest'
      responses:
        '202':
          description: >-
            Invocation accepted — the run record (status running) is returned
            and the agent call completes asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            Agent not found — returned both when the agent does not exist and
            when the caller lacks namespace access (existence non-leak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/agents/sessions:
    get:
      summary: List agent chat sessions
      description: >-
        Returns past chat conversations, most-recent-first (Story 50.6). A
        session is a server-side VIEW over the run store: Knodex-owned run
        records are grouped by a Knodex-side conversationId (runs with an empty
        conversationId each form a singleton session keyed by their run id, so
        legacy runs are listed and never dropped). There is NO read-back from
        kagent's session store. Visibility reuses the same Casbin-derived
        accessible-namespace filter as GET /api/v1/agents/runs (a session is
        visible only when its agent namespace matches the caller's set,
        fail-closed), applied to runs BEFORE grouping. Pagination is applied
        after grouping.
      tags: [agents]
      operationId: listAgentSessions
      security:
        - bearerAuth: []
      parameters:
        - name: agentType
          in: query
          required: false
          schema:
            type: string
          description: Exact-match filter on the agent identifier.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (max 100).
      responses:
        '200':
          description: Chat sessions visible to the caller, most-recent-first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/agents/sessions/{id}:
    get:
      summary: Get a chat session for replay
      description: >-
        Returns the full run records of a chat session ordered oldest→newest
        (Story 50.6), the source for read-only conversation replay. Visibility
        is enforced (the same namespace filter as the sessions list) BEFORE the
        lookup, so an unknown id and a denied id both return the same 404
        (existence non-leak). The web reconstructs each turn and fetches each
        run's full response via GET /api/v1/agents/runs/{id}/result; when a
        run's result has expired, replay degrades to its recommendationSummary.
      tags: [agents]
      operationId: getAgentSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Session id (the conversationId, or a run id for legacy singletons).
      responses:
        '200':
          description: The session's runs, oldest→newest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            Unknown session id, or the caller lacks namespace access (non-leak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # -------------------------------------------------------------------------
  # Settings
  # -------------------------------------------------------------------------
  /api/v1/settings:
    get:
      summary: Get platform settings
      description: Returns platform-level settings. Any authenticated user can read.
      tags: [settings]
      operationId: getSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'

