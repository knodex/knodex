apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teams.knodex.io
  labels:
    app.kubernetes.io/name: knodex
    app.kubernetes.io/component: rbac
spec:
  group: knodex.io
  names:
    kind: Team
    listKind: TeamList
    plural: teams
    singular: team
    shortNames:
      - team
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - oidcGroups
              properties:
                description:
                  type: string
                  description: "Human-readable description of the team."
                  maxLength: 1024
                oidcGroups:
                  type: array
                  description: "OIDC group names this team represents. Resolved into project RBAC when a Project role references the team."
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                    maxLength: 253

            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: "Current state conditions"
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: "Condition type"
                        enum:
                          - Ready
                          - ValidationError
                      status:
                        type: string
                        description: "Condition status"
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "Last time the condition transitioned"
                      reason:
                        type: string
                        description: "Reason for the condition's last transition"
                        maxLength: 256
                      message:
                        type: string
                        description: "Human-readable message for the condition"
                        maxLength: 1024

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Description
          type: string
          description: Team description
          jsonPath: .spec.description
        - name: Age
          type: date
          description: Time since creation
          jsonPath: .metadata.creationTimestamp
