{{- /*
Chart-managed Postgres credential Secret (named <fullname>-postgres).

Renders the DATABASE_URL DSN when an EXTERNAL supply is configured INLINE (no
pre-existing Secret) and the embedded subchart path is NOT active. Two sources,
in precedence order:

  1. externalPostgresql.host set AND no externalPostgresql.existingSecret —
     the chart assembles the DSN from externalPostgresql.{username,password,host,
     port,database,sslMode} (canonical inline external path).
  2. enterprise.postgres.connectionString set AND no connectionStringSecret.name
     (and no externalPostgresql supply) — DEPRECATED inline alias; the value is
     already a full DSN.

When externalPostgresql.existingSecret or enterprise.postgres.connectionStringSecret.name
is set, the operator owns the Secret and this template renders nothing.

Annotated `helm.sh/resource-policy: keep` so a chart uninstall does not destroy
operator-managed credentials.
*/ -}}
{{- $embedded := include "knodex.postgresEmbeddedEnabled" . -}}
{{- $externalInline := and .Values.externalPostgresql.host (not .Values.externalPostgresql.existingSecret) -}}
{{- $legacyInline := and .Values.enterprise.postgres.connectionString (not .Values.enterprise.postgres.connectionStringSecret.name) (not .Values.externalPostgresql.host) (not .Values.externalPostgresql.existingSecret) -}}
{{- if and (not $embedded) (or $externalInline $legacyInline) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knodex.postgresSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knodex.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
{{- if $externalInline }}
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" .Values.externalPostgresql.username .Values.externalPostgresql.password .Values.externalPostgresql.host (.Values.externalPostgresql.port | default 5432) .Values.externalPostgresql.database (.Values.externalPostgresql.sslMode | default "require") | quote }}
{{- else }}
data:
  DATABASE_URL: {{ .Values.enterprise.postgres.connectionString | b64enc }}
{{- end }}
{{- end }}
